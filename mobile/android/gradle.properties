# RAM cho Gradle khi build. Mặc định của Flutter là 8G, quá nhiều với máy 8 GB RAM
# (máy ảo Android bị tắt vì hết RAM). 2G là đủ cho app cỡ này.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows: dự án ở ổ D: còn thư viện Flutter (Pub cache) ở ổ C: thì Kotlin biên dịch tăng dần
# báo lỗi "this and base files have different roots". Tắt đi cho build ổn định (app hầu như không có Kotlin).
kotlin.incremental=false
