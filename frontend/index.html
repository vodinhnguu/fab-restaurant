<!doctype html>
<html lang="vi">

    <meta name="description" content="Ngưu Quán - Nhà hàng hải sản tươi sống tại biển Mỹ Khê, Đà Nẵng. Tôm hùm, cua, cá mú chọn con tại hồ, cân tại chỗ. Đặt bàn và đặt món online." />
    <meta name="theme-color" content="#0b3954" />

    <!-- Thẻ xem trước khi dán link vào Zalo, Facebook, Messenger (Open Graph) và X/Twitter.
         Khi đưa web lên mạng thật: thêm 1 thẻ meta property "og:url" trỏ về tên miền,
         và đổi og:image sang ảnh thật của nhà hàng (nên dùng ảnh 1200 x 630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ngưu Quán" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Ngưu Quán - Hải sản tươi sống Đà Nẵng" />
    <meta
      property="og:description"
      content="Tôm hùm, cua, cá mú bơi tại hồ: chọn con, cân tại chỗ, chế biến theo ý bạn. Đặt bàn chỉ với vài cú chạm."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1615141982883-c7ad0e69fd62?w=1200&h=630&q=80&auto=format&fit=crop"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hải sản tươi sống tại Ngưu Quán" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
